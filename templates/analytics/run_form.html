{% extends "base.html" %}
{% block title %}Настройка запуска{% endblock %}
{% block content %}
<h1 class="h3">Настройка запуска — {{ project.name }}</h1>
<p class="text-muted">Все параметры попадают в паспорт запуска и определяют воспроизводимость.</p>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" class="card card-body">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Версия данных</label>
    <select class="form-select" name="dataset" required>
      {% for ds in datasets %}
        <option value="{{ ds.uuid }}">v{{ ds.version }} ({{ ds.row_count }} строк)</option>
      {% endfor %}
    </select>
  </div>
  {{ form.as_p }}
  <button class="btn btn-primary">Запустить анализ</button>
</form>
{% endblock %}
