{% extends "base.html" %}
{% block title %}Импорт{% endblock %}
{% block content %}
<p class="page-kicker">Шаг 1 из 3</p>
<h1 class="h3 mb-2">Загрузка файла — {{ project.name }}</h1>
<p class="text-muted">Допустимы CSV и XLSX. Файл сначала помещается в карантин.</p>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" enctype="multipart/form-data" class="surface" style="max-width: 36rem;">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="id_file">Файл</label>
    <input class="form-control" id="id_file" type="file" name="file" accept=".csv,.xlsx" required>
  </div>
  <button class="btn btn-primary">Загрузить</button>
</form>
{% endblock %}
